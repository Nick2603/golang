version: '3.9'

services:
  app:
    build: .
    container_name: backend_app
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      MONGODB_URI: "mongodb://mongo:27017"
      MONGODB_DATABASE: "backend"
      JWT_SECRET: "change-this-secret-in-production"
      JWT_EXPIRY_HOURS: "24"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: backend_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo_data:
